name: Bug report
description: A tool failed, or its output looks wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please **don't attach your real export**: it contains personal health data. If the problem only shows with your file, paste a few rows with the values changed.
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Hevy to SparkyFitness
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tool version
      description: Run the tool with `--version`, or see the footer of its web page.
      placeholder: "1.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Computer, and browser or Python version
      description: For example "Android, Chrome (web page)" or "Windows 11, Python 3.12".
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: What you did
      description: The options you chose on the web page, or the command you ran.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What the page showed or the tool printed
      description: Copy the whole message, including any error.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample rows (optional)
      description: The header line and a few rows that show the problem, with personal values changed.
      render: text
