name: Bug report
description: A tool failed, or its output looks wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please **don't attach your real export**: it contains personal health data. If the problem only shows with your file, paste a few rows with the values changed.
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Hevy to SparkyFitness
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tool version
      description: Run the tool with `--version`.
      placeholder: "1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Computer and Python version
      description: For example "Windows 11, Python 3.12" (run `py --version` or `python3 --version`).
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What the tool printed
      description: Copy the whole output, including any error.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample rows (optional)
      description: The header line and a few rows that show the problem, with personal values changed.
      render: text
