name: Website

# Publishes site/, each tool's pages and Pyodide (for the in-browser tools) to
# GitHub Pages, only after CI has passed on main, so a broken tool is never
# offered for download.
# Requires Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/cache@v5
        with:
          path: .cache/pyodide
          key: pyodide-${{ hashFiles('scripts/pyodide.json') }}
      - name: Build the website
        run: python scripts/build_site.py --out _site --with-pyodide
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
