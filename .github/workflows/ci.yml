name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Python and a current release.
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Run every tool's tests
        run: uv run --no-project python scripts/run_tests.py

  site:
    name: Tool folders and website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check tool folders, manifests and website
        run: python scripts/build_site.py --check

  web:
    name: Browser tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/cache@v5
        with:
          path: .cache/pyodide
          key: pyodide-${{ hashFiles('scripts/pyodide.json') }}
      - name: Build the website with Pyodide
        run: python scripts/build_site.py --out _site --with-pyodide
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run the browser tests
        run: node scripts/run_web_tests.mjs _site
